<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Usuarios</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="navbar">

    <h2>Gestión de Usuarios</h2>

    <a href="/home" class="back-home">
        Volver al Home
    </a>

</div>

<div class="crud-container">

    <div class="crud-header">
        <h1 class="crud-title">Lista de Usuarios</h1>
    </div>

    <div class="crud-actions">
        <button class="add-btn">
            Nuevo Usuario
        </button>
    </div>

    <table>

        <thead>
        <tr>
            <th>Código</th>
            <th>Nombre de Usuario</th>
            <th>Contraseña</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="usuario : ${usuarios}">

            <td th:text="${usuario.codigo_usuario}"></td>
            <td th:text="${usuario.username}"></td>
            <td th:text="${usuario.pasword}"></td>
            <td th:text="${usuario.email}"></td>
            <td th:text="${usuario.rol}"></td>
            <td th:text="${usuario.estado}"></td>

            <td>
                <div class="table-actions">

                    <button class="edit-btn">
                        Editar
                    </button>

                    <button class="delete-btn"
                            th:onclick="'deleteUsuario(' + ${usuario.codigo_usuario} + ')'">
                        Eliminar
                    </button>

                </div>
            </td>

        </tr>

        </tbody>

    </table>

</div>

<script>

    function deleteUsuario(id){

        if(!confirm("¿Eliminar este usuario?")){
            return;
        }

        fetch('/api/usuarios/' + id,{
            method:'DELETE'
        })
        .then(res=>{
            if(res.ok){
                location.reload();
            }else{
                alert("Error al eliminar");
            }
        });

    }

</script>

</body>
</html>
