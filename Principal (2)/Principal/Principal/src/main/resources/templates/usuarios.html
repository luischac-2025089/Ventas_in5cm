<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Usuarios</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="navbar">

    <h2>Gestión de Usuarios</h2>

    <a th:href="@{/home}" class="back-home">
        Volver al Home
    </a>

</div>

<div class="crud-container">

    <div class="crud-header">
        <h1 class="crud-title">Lista de Usuarios</h1>
    </div>

    <!-- BOTÓN NUEVO -->
    <div class="crud-actions">
        <a th:href="@{/usuarios/nuevo}" class="action-btn add-btn">
            Nuevo Usuario
        </a>
    </div>

    <table>

        <thead>
        <tr>
            <th>Código</th>
            <th>Nombre de Usuario</th>
            <th>Contraseña</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="usuario : ${usuarios}">

            <td th:text="${usuario.codigo_usuario}"></td>
            <td th:text="${usuario.username}"></td>
            <td th:text="${usuario.pasword}"></td>
            <td th:text="${usuario.email}"></td>
            <td th:text="${usuario.rol}"></td>
            <td th:text="${usuario.estado}"></td>

            <td>
                <div class="table-actions">

                    <!-- EDITAR -->
                    <a th:href="@{/usuarios/editar/{id}(id=${usuario.codigo_usuario})}"
                       class="action-btn edit-btn">
                        Editar
                    </a>

                    <!-- ELIMINAR -->
                    <a th:href="@{/usuarios/eliminar/{id}(id=${usuario.codigo_usuario})}"
                       class="action-btn delete-btn"
                       onclick="return confirm('¿Eliminar este usuario?')">
                        Eliminar
                    </a>

                </div>
            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
