<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Formulario Ventas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="crud-container">

    <div class="crud-header">
        <h1 class="crud-title">Formulario de Venta</h1>
    </div>

    <form th:action="@{/ventas/guardar}" th:object="${venta}" method="post">

        <input type="hidden" th:field="*{codigo_venta}">

        <div class="form-group">
            <label>Fecha de Venta</label>
            <input type="date" th:field="*{fecha_venta}" required>
        </div>

        <div class="form-group">
            <label>Total</label>
            <input type="number" step="0.01" th:field="*{total}" required>
        </div>

        <div class="form-group">
            <label>DPI Cliente</label>
            <input type="number" th:field="*{clientes_dpi_cliente}" required>
        </div>

        <div class="form-group">
            <label>Código Usuario</label>
            <input type="number" th:field="*{usuarios_codigo_usuario}" required>
        </div>

        <div class="crud-actions">

            <button type="submit" class="add-btn">
                Guardar
            </button>

            <a th:href="@{/ventas}" class="delete-btn">
                Cancelar
            </a>

        </div>

    </form>

</div>

</body>
</html>
