<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Detalle Venta Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="crud-container">

    <h1 class="crud-title">Formulario Detalle Venta</h1>

    <form th:action="@{/detalleventas/guardar}" th:object="${detalleventa}" method="post">

        <input type="hidden" th:field="*{codigo_detalle_venta}">

        <div class="form-group">
            <label>Cantidad</label>
            <input type="number" th:field="*{cantidad}">
        </div>

        <div class="form-group">
            <label>Precio Unitario</label>
            <input type="number" step="0.01" th:field="*{precio_unitario}">
        </div>

        <div class="form-group">
            <label>Subtotal</label>
            <input type="number" step="0.01" th:field="*{subtotal}">
        </div>

        <div class="form-group">
            <label>Producto</label>
            <input type="number" th:field="*{productos_codigo_producto}">
        </div>

        <div class="form-group">
            <label>Venta</label>
            <input type="number" th:field="*{ventas_codigo_venta}">
        </div>

        <div class="crud-actions">

            <button type="submit" class="add-btn">
                Guardar
            </button>

            <a th:href="@{/detalleventas}" class="delete-btn">
                Cancelar
            </a>

        </div>

    </form>

</div>

</body>
</html>
