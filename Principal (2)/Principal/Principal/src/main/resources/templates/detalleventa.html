<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>DetalleVenta</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="navbar">
    <h2>Gestión de Detalles de Ventas</h2>

    <a href="/home" class="back-home">
        Volver al Home
    </a>
</div>

<div class="crud-container">

    <div class="crud-header">
        <h1 class="crud-title">Lista de Detalles de Ventas</h1>
    </div>

    <div class="crud-actions">
        <button class="add-btn">
            Nuevo Detalle
        </button>
    </div>

    <table>

        <thead>
        <tr>
            <th>Código</th>
            <th>Cantidad</th>
            <th>Precio Unitario</th>
            <th>Producto</th>
            <th>Venta</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="detalle : ${detalleventas}">

            <td th:text="${detalle.codigo_detalle_venta}"></td>
            <td th:text="${detalle.cantidad}"></td>
            <td th:text="${detalle.precio_unitario}"></td>
            <td th:text="${detalle.productos_codigo_producto}"></td>
            <td th:text="${detalle.ventas_codigo_venta}"></td>

            <td>
                <div class="table-actions">

                    <button class="edit-btn">
                        Editar
                    </button>

                    <button class="delete-btn"
                            th:onclick="'deleteDetalle(' + ${detalle.codigo_detalle_venta} + ')'">
                        Eliminar
                    </button>

                </div>
            </td>

        </tr>

        </tbody>

    </table>

</div>

<script>

    function deleteDetalle(id){

        if(!confirm("¿Eliminar este detalle de venta?")){
            return;
        }

        fetch('/detalleventas/' + id,{
            method:'DELETE'
        })
        .then(res=>{
            if(res.ok){
                location.reload();
            }else{
                alert("Error al eliminar");
            }
        });

    }

</script>

</body>
</html>
