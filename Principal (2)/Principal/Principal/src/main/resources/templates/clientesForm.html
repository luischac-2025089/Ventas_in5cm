<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Formulario de Cliente</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="navbar">

    <h2>Gestión de Clientes</h2>

    <a th:href="@{/clientes}" class="back-home">
        Volver a Clientes
    </a>

</div>

<div class="crud-container">

    <div class="crud-header">
        <h1 class="crud-title">Formulario de Cliente</h1>
    </div>

    <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">

        <div class="form-group">
            <label>DPI</label>
            <input type="number" th:field="*{dpi_cliente}">
        </div>

        <div class="form-group">
            <label>Nombre</label>
            <input type="text" th:field="*{nombre_cliente}" required>
        </div>

        <div class="form-group">
            <label>Apellido</label>
            <input type="text" th:field="*{apellido_cliente}" required>
        </div>

        <div class="form-group">
            <label>Dirección</label>
            <input type="text" th:field="*{direccion}" required>
        </div>

        <div class="form-group">
            <label>Estado</label>
            <input type="number" th:field="*{estado}" required>
        </div>

        <div class="crud-actions">

            <button type="submit" class="add-btn">
                Guardar
            </button>

            <a th:href="@{/clientes}" class="delete-btn">
                Cancelar
            </a>

        </div>

    </form>

</div>

</body>
</html>
