<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Productos</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="navbar">

    <h2>Gestión de Productos</h2>

    <a href="/home" class="back-home">
        Volver al Home
    </a>

</div>

<div class="crud-container">

    <div class="crud-header">
        <h1 class="crud-title">Lista de Productos</h1>
    </div>

    <div class="crud-actions">
        <button class="add-btn">
            Nuevo Producto
        </button>
    </div>

    <table>

        <thead>
        <tr>
            <th>Código</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="producto : ${productos}">

            <td th:text="${producto.codigo_producto}"></td>
            <td th:text="${producto.nombre_producto}"></td>
            <td th:text="${producto.precio}"></td>
            <td th:text="${producto.stock}"></td>
            <td th:text="${producto.estado}"></td>

            <td>
                <div class="table-actions">

                    <button class="edit-btn">
                        Editar
                    </button>

                    <button class="delete-btn"
                            th:onclick="'deleteProducto(' + ${producto.codigo_producto} + ')'">
                        Eliminar
                    </button>

                </div>
            </td>

        </tr>

        </tbody>

    </table>

</div>

<script>

    function deleteProducto(id){

        if(!confirm("¿Eliminar este producto?")){
            return;
        }

        fetch('/api/productos/' + id,{
            method:'DELETE'
        })
        .then(res=>{
            if(res.ok){
                location.reload();
            }else{
                alert("Error al eliminar");
            }
        });

    }

</script>

</body>
</html>
