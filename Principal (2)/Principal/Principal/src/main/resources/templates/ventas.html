<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Ventas</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="navbar">

    <h2>Gestión de Ventas</h2>

    <a href="/home" class="back-home">
        Volver al Home
    </a>

</div>

<div class="crud-container">

    <div class="crud-header">
        <h1 class="crud-title">Lista de Ventas</h1>
    </div>

    <div class="crud-actions">
        <button class="add-btn">
            Nueva Venta
        </button>
    </div>

    <table>

        <thead>
        <tr>
            <th>Código</th>
            <th>Fecha de Venta</th>
            <th>Total</th>
            <th>Estado</th>
            <th>DPI de Cliente</th>
            <th>Código de Usuario</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="venta : ${ventas}">

            <td th:text="${venta.codigo_venta}"></td>
            <td th:text="${venta.fecha_venta}"></td>
            <td th:text="${venta.total}"></td>
            <td th:text="${venta.estado}"></td>
            <td th:text="${venta.clientes_dpi_cliente}"></td>
            <td th:text="${venta.usuarios_codigo_usuario}"></td>

            <td>
                <div class="table-actions">

                    <button class="edit-btn">
                        Editar
                    </button>

                    <button class="delete-btn"
                            th:onclick="'deleteVenta(' + ${venta.codigo_venta} + ')'">
                        Eliminar
                    </button>

                </div>
            </td>

        </tr>

        </tbody>

    </table>

</div>

<script>

    function deleteVenta(id){

        if(!confirm("¿Eliminar esta venta?")){
            return;
        }

        fetch('/api/ventas/' + id,{
            method:'DELETE'
        })
        .then(res=>{
            if(res.ok){
                location.reload();
            }else{
                alert("Error al eliminar");
            }
        });

    }

</script>

</body>
</html>
